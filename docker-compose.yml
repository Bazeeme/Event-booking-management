services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventbooking}
      POSTGRES_USER: ${POSTGRES_USER:-eventapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basi1516}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventapp} -d ${POSTGRES_DB:-eventbooking}"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventapp}:${POSTGRES_PASSWORD:-basi1516}@db:5432/${POSTGRES_DB:-eventbooking}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-before-deploy}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    ports: ["5000:5000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
